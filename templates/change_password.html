{% extends "base.html" %}
{% block page_title %}Change admin password{% endblock %}
{% block content %}
<section class="panel narrow"><span class="eyebrow">ACCOUNT SECURITY</span><h3>Update your password</h3>
<form method="post" class="stack-form"><label>Current password</label><input type="password" name="current_password" required><label>New password (12+ characters)</label><input type="password" name="new_password" minlength="12" required><button class="btn primary">Update password</button></form></section>
{% endblock %}
